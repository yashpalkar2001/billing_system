services:
  db:
    image: postgres:16
    container_name: wine-billing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wine_billing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wine_billing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wine_billing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wine_billing_data:
